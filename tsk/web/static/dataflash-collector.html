<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DataFlash Dump</title>
    <style>
      * { box-sizing: border-box; margin: 0; }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
        background: #f2f2f7;
        color: #1c1c1e;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      .page {
        width: min(100vw, 460px);
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        flex: 1;
        min-height: 100vh;
      }

      .back-bar {
        padding: 12px 20px;
      }

      .back-link {
        color: #007aff;
        font-size: 17px;
        text-decoration: none;
        -webkit-tap-highlight-color: transparent;
      }

      .back-link::before {
        content: "‹ ";
      }

      .page-header {
        padding: 0 20px 12px;
      }

      .page-title {
        font-size: 28px;
        font-weight: 700;
      }

      .terminal {
        margin: 0 16px 16px;
        background: #1c1c1e;
        border-radius: 12px;
        padding: 16px;
        flex: 1;
        overflow-y: auto;
        overflow-x: hidden;
        font-family: "SF Mono", ui-monospace, monospace;
        font-size: 13px;
        line-height: 1.6;
        color: #e5e5ea;
        white-space: pre-wrap;
        word-break: break-all;
      }

      .terminal .err { color: #ff453a; }
      .terminal .ok { color: #30d158; }
      .terminal .warn { color: #ff9f0a; }
      .terminal .dim { color: #8e8e93; }

      .controls {
        margin: 0 16px 12px;
        background: #fff;
        border-radius: 12px;
        padding: 14px 16px;
        font-size: 14px;
        line-height: 1.4;
      }

      .controls label { display: block; margin-bottom: 12px; }
      .controls button {
        width: 100%; padding: 12px; border: 0; border-radius: 10px;
        font-size: 16px; font-weight: 600; background: #007aff; color: white;
      }
    </style>
  </head>
  <body>
    <main class="page">
      <div class="back-bar">
        <a class="back-link" href="/">TSK Manager</a>
      </div>
      <header class="page-header">
        <div class="page-title">DataFlash Dump</div>
      </header>
      <div class="controls">
        <label>
          <input type="checkbox" id="recoveryPayload">
          Experimental auto-reset payload after a complete dump. This is a locally re-authenticated derivative of the statically recovered reset-ending body; the raw external candidate is never sent. Not yet vehicle-confirmed.
        </label>
        <button id="startBtn" type="button">Start dump</button>
      </div>
      <div class="terminal" id="terminal"></div>
    </main>

    <script>
      const terminal = document.getElementById("terminal");
      const startBtn = document.getElementById("startBtn");
      const recoveryPayload = document.getElementById("recoveryPayload");

      function termWrite(text, className) {
        const span = document.createElement("span");
        if (className) span.className = className;
        span.textContent = text + "\n";
        terminal.appendChild(span);
        terminal.scrollTop = terminal.scrollHeight;
      }

      function sleep(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
      }

      async function getStatus() {
        const response = await fetch("/api/dataflash-status", { cache: "no-store" });
        return response.json();
      }

      function progressBar(bytes, total) {
        const pct = total ? Math.round(bytes / total * 100) : 0;
        const filled = Math.max(0, Math.min(20, Math.round(pct / 5)));
        const bar = "█".repeat(filled) + "░".repeat(20 - filled);
        return `  [${bar}] ${bytes}/${total}`;
      }

      function writeOutcome(s) {
        termWrite("");
        if (s.status === "complete") {
          termWrite("Dump complete.", "ok");
        } else if (s.status === "partial") {
          termWrite(s.message || "Partial dump. Try Find, or dump again.", "warn");
        } else if (s.status === "unusable_partial") {
          termWrite(s.message || "Partial dump. Not enough data. Dump again.", "err");
        } else {
          termWrite(s.message || "Dump failed.", "err");
        }
      }

      async function runDump() {
        // Attach to an in-progress dump, or short-circuit a finished one, before
        // starting a fresh dump. Revisiting the page after a complete dump does
        // not re-dump; revisiting after partial/unusable_partial/failed retries.
        let s = null;
        try {
          s = await getStatus();
        } catch (err) { /* server not reachable yet, fall through to start */ }

        if (s && s.status === "complete") {
          termWrite("Dump already complete.", "ok");
          return;
        }

        if (s && s.status === "running") {
          termWrite("A dump is already in progress — attaching...");
        } else {
          termWrite("Starting DataFlash dump.");
          termWrite("The EPS may reset during the dump; preserve the evidence bundle before another active experiment.", "warn");
          try {
            const useRecoveryPayload = recoveryPayload.checked;
            termWrite("Payload: " + (useRecoveryPayload ? "experimental auto-reset" : "standard"),
                      useRecoveryPayload ? "warn" : "dim");
            const response = await fetch("/api/dataflash-dump", {
              method: "POST",
              cache: "no-store",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ use_recovery_payload: useRecoveryPayload }),
            });
            const started = await response.json();
            if (!started.ok && started.status !== "running") {
              termWrite(started.message || "Could not start dump.", "err");
              return;
            }
          } catch (err) {
            termWrite(String(err), "err");
            return;
          }
        }

        termWrite("Dumping 0xFF200000-0xFF208000.");
        let lastBytes = -1;
        while (true) {
          await sleep(500);
          try {
            s = await getStatus();
          } catch (err) {
            continue;  // transient poll failure, keep waiting
          }
          if (s.status === "running") {
            if (s.bytes !== lastBytes) {
              lastBytes = s.bytes;
              termWrite(progressBar(s.bytes, s.total || 32768));
            }
            continue;
          }
          writeOutcome(s);
          break;
        }
      }

      startBtn.addEventListener("click", async () => {
        startBtn.disabled = true;
        recoveryPayload.disabled = true;
        try {
          await runDump();
        } finally {
          startBtn.disabled = false;
          recoveryPayload.disabled = false;
        }
      });
    </script>
  </body>
</html>
