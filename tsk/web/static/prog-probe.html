<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Programming Handoff Probe</title>
    <style>
      * { box-sizing: border-box; margin: 0; }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
        background: #f2f2f7;
        color: #1c1c1e;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      .page {
        width: min(100vw, 460px);
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        flex: 1;
        min-height: 100vh;
      }

      .back-bar { padding: 12px 20px; }

      .back-link {
        color: #007aff;
        font-size: 17px;
        text-decoration: none;
        -webkit-tap-highlight-color: transparent;
      }

      .back-link::before { content: "‹ "; }

      .page-header { padding: 0 20px 12px; }

      .page-title { font-size: 26px; font-weight: 700; }

      .terminal {
        margin: 0 16px 16px;
        background: #1c1c1e;
        border-radius: 12px;
        padding: 16px;
        flex: 1;
        overflow-y: auto;
        overflow-x: hidden;
        font-family: "SF Mono", ui-monospace, monospace;
        font-size: 12px;
        line-height: 1.55;
        color: #e5e5ea;
        white-space: pre-wrap;
        word-break: break-all;
      }

      .terminal .err { color: #ff453a; }
      .terminal .ok { color: #30d158; }
      .terminal .warn { color: #ff9f0a; }
      .terminal .dim { color: #8e8e93; }
    </style>
  </head>
  <body>
    <main class="page">
      <div class="back-bar">
        <a class="back-link" href="/">TSK Manager</a>
      </div>
      <header class="page-header">
        <div class="page-title">Programming Handoff Probe</div>
      </header>
      <div class="terminal" id="terminal"></div>
    </main>

    <script>
      const terminal = document.getElementById("terminal");

      function termWrite(text, className) {
        const span = document.createElement("span");
        if (className) span.className = className;
        span.textContent = text + "\n";
        terminal.appendChild(span);
        terminal.scrollTop = terminal.scrollHeight;
      }

      function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

      async function getStatus() {
        const r = await fetch("/api/prog-probe-status", { cache: "no-store" });
        return r.json();
      }

      function renderProbe(s) {
        termWrite("");
        termWrite("Programming Handoff Probe", "ok");
        termWrite("Panda: " + (s.panda || "?"));

        const route = s.route || {};
        if (s.eps_bus === undefined || s.eps_bus === -1) {
          termWrite("EPS route: no response", "err");
        } else {
          termWrite("Route: " + (route.eps_tx || "?") + "/b" + s.eps_bus +
                    " -> " + (route.eps_rx || "?") + "/b" + (route.eps_rx_bus ?? "?"));
          termWrite("Panda physical route: ELM param " + (route.elm327_param ?? "?") +
                    " (" + (route.semantic_path || "?") + ")",
                    route.semantic_path === "normal-harness" ? "ok" : "warn");
        }

        const app = s.application_f181 || {};
        const boot = s.bootloader_f181 || {};
        if (app.ascii || boot.ascii) {
          termWrite("");
          termWrite("F181 identity:");
          termWrite("  application: " + (app.ascii || "-"));
          termWrite("  after handoff: " + (boot.ascii || "-"));
        }

        termWrite("");
        termWrite("Controlled transition:");
        for (const a of (s.attempts || [])) {
          const mark = a.ok ? "✓ " : "✗ ";
          termWrite("  " + mark + a.name, a.ok ? "ok" : "err");
          termWrite("      " + a.detail, a.ok ? "ok" : "dim");
        }

        const dit = s.did_it_take || {};
        if (dit.switched !== undefined) {
          termWrite("");
          termWrite("Handoff discriminator:");
          termWrite("  endpoint reappeared: " + (dit.switched ? "yes" : "no"), dit.switched ? "ok" : "warn");
          termWrite("  initial 10 02 response timed out: " + (dit.response_timeout ? "yes" : "no"),
                    dit.response_timeout ? "warn" : "dim");
          if (dit.evidence) termWrite("  " + dit.evidence, "dim");
        }

        const functional = s.functional_0x777 || {};
        if (functional.before || functional.after) {
          termWrite("");
          termWrite("Sienna-calibration functional 0x777 check:");
          termWrite("  before: " + ((functional.before || {}).observed ? "observed" : "not observed"));
          termWrite("  after : " + ((functional.after || {}).observed ? "observed" : "not observed"));
        }

        const handoff = s.programming_handoff || {};
        if (handoff.health_before || handoff.health_after_request || handoff.health_after_reappearance) {
          termWrite("");
          termWrite("Panda health telemetry captured around transition.", "dim");
          termWrite("Export the evidence bundle for complete health/can_health fields.", "dim");
        }

        termWrite("");
        if (s.message) termWrite(s.message, s.status === "entered" ? "ok" : "warn");
        termWrite("");
        termWrite("No SecurityAccess key, payload, download, or flash request is sent by this probe.", "dim");
      }

      async function runProbe() {
        let s = null;
        try { s = await getStatus(); } catch (err) { /* fall through */ }

        if (s && s.status === "running") {
          termWrite("A probe is already in progress — attaching...");
        } else {
          termWrite("Starting programming-session probe.");
          termWrite("The car may reset the EPS. One firmware-informed handoff is tested; nothing is dumped.", "warn");
          try {
            const r = await fetch("/api/prog-probe", { method: "POST", cache: "no-store" });
            const started = await r.json();
            if (!started.ok && started.status !== "running") {
              termWrite(started.message || "Could not start the probe.", "err");
              return;
            }
          } catch (err) {
            termWrite(String(err), "err");
            return;
          }
        }

        termWrite("Testing one route-preserving programming handoff...");
        let last = -1;
        while (true) {
          await sleep(500);
          try { s = await getStatus(); } catch (err) { continue; }
          if (s.status === "running") {
            if ((s.attempt_count || 0) !== last) {
              last = s.attempt_count || 0;
              termWrite("  step " + last + (s.last ? "  " + s.last : ""));
            }
            continue;
          }
          renderProbe(s);
          break;
        }
      }

      runProbe();
    </script>
  </body>
</html>
